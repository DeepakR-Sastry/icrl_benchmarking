# Maximum Entropy (his "MECL") on AntWall as Liu et al. run it: his config
# config/mujoco_BlockedAntWall/train_ICRL_AntWall-v0.yaml (commit 0d79d2c),
# run as his tutorial: train_icrl.py <config> -n 5 -s <seed>.
# = configs/hc/liu_maximum_entropy.yaml with only what his Ant config changes
# (diffed against his HC ME config, 2026-11-15): env, pile, the PPO values
# below (= Malik's Ant README values), the CN block and n_iters.
# Unset = our defaults, which equal his values here.
# Lines of his with no setting here: the PID coefficients (ignored:
# algo_type 'lagrangian'), cn_batch_size null (full batch = ours),
# cn_normalize False (no normalisation = ours), clip_obs 20 (= the
# featurizer below), budget 0 (= ours), sample_rollouts 50 (= len(expert),
# as our loop), store_sample_rollouts (buffer off).
nominal_env: {name: ant_wall}                        # train_env_id AntWall-v0
# His evaluation runs in the sampling env = the *unconstrained* AntWall
# (eval_env_id is only passed to his sampler), 10 episodes; we log his
# feasible reward next to the total (docs/decisions.md, 2026-11-01).
eval_env: {name: ant_wall}
true_cost: {name: ant_wall}                          # ours x <= -3; his x < -3 (docs/envs.md)
# His network clips observations to +-20 and actions to their bounds
# (ConstraintNet.prepare_data, clip_obs 20) = this featurizer, 121 columns.
featurizer: {name: ant_wall}
# His expert pile = Malik's 46 Ant rollouts renamed + 4 repeats, read as his
# code reads it — bug (5) reproduced on purpose (docs/envs.md, methods.md);
# made by scripts/make_liu_expert.py --env ant.
expert: expert_data/ant_liu.pkl                      # expert_rollouts: 50
n_envs: 5                                            # -n 5
agent:
  name: ppo_lagrangian
  batch_size: 128                                    # PPO.batch_size
  n_epochs: 20                                       # PPO.n_epochs
  learning_rate: 3.0e-5                              # PPO.learning_rate
  clip_range: 0.4                                    # PPO.clip_range
  reward_gae_lambda: 0.9                             # PPO.reward_gae_lambda
  cost_gae_lambda: 0.9                               # PPO.cost_gae_lambda
  target_kl: 0.02                                    # PPO.target_kl
  penalty_initial_value: 0.1                         # PPO.penalty_initial_value
  penalty_learning_rate: 0.05                        # PPO.penalty_learning_rate
  # dont_normalize_obs / _reward / _cost: False -> all three on.
  normalize_obs: true
  normalize_reward: true
  normalize_cost: true
method:
  name: maximum_entropy
  hidden_sizes: [40, 40]                             # cn_layers
  learning_rate: 0.005                               # cn_learning_rate
  anneal_lr_by_factor: 0.9                           # anneal_clr_by_factor
  backward_iters: 5                                  # backward_iters
  reg_coeff: 0.6                                     # cn_reg_coeff
  importance_sampling: true                          # no_importance_sampling: False
  per_step_importance_sampling: true                 # his bug (1): weights unused in the loss
  target_kl_old_new: 10.0                            # cn_target_kl_old_new
  target_kl_new_old: 2.5                             # cn_target_kl_new_old
  eps: 1.0e-5                                        # cn_eps
  # input_columns unset: all 121 columns (his code has no bug (2)).
  init_seed: 0                                       # his bug (6): every run from seed 0's network
loop:
  n_rounds: 50                                       # n_iters
  steps_per_round: 200000                            # forward_timesteps
  n_eval_episodes: 10                                # n_eval_episodes
  nominal_buffer: false                              # use_buffer: False
seed: 0
